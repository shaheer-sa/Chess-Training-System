<!DOCTYPE html>
<html lang="en" class="rv-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookvex — Play. Analyze. Improve.</title>
    <meta name="description" content="Rookvex: pick a piece and see the immediate material consequences of every legal move. Safe, even trade, loses material, or unclear — always with a reason." />
    <link rel="icon" type="image/svg+xml" href="/src/app/assets/brand/rookvex-mark.svg" />
    <style>
      html, body { margin: 0; padding: 0; background: #2D231E; }
      /* Loading screen: shown until the app has started (see src/main.tsx). */
      #rv-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(60% 50% at 50% 45%, #3b2b22 0%, #2D231E 70%); transition: opacity 380ms ease, visibility 380ms; }
      #rv-splash.rv-splash--out { opacity: 0; visibility: hidden; pointer-events: none; }
      #rv-splash svg path { fill: transparent; stroke: #D45C1C; stroke-width: 1.2; stroke-dasharray: 120; stroke-dashoffset: 120; animation: rv-draw 900ms ease forwards, rv-fill 400ms ease 700ms forwards; }
      #rv-splash .rv-splash-word { font: 700 22px/1 Cinzel, Georgia, serif; letter-spacing: .32em; color: #F3E9DC; opacity: 0; animation: rv-splash-in 600ms ease 350ms forwards; padding-left: .32em; }
      #rv-splash .rv-splash-bar { width: 120px; height: 2px; border-radius: 2px; background: rgba(212,92,28,.2); overflow: hidden; position: relative; }
      #rv-splash .rv-splash-bar::before { content: ''; position: absolute; inset: 0; width: 40%; background: #D45C1C; animation: rv-splash-bar 1s ease-in-out infinite; }
      @keyframes rv-draw { to { stroke-dashoffset: 0; } }
      @keyframes rv-fill { to { fill: #D45C1C; } }
      @keyframes rv-splash-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes rv-splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #rv-splash svg path { animation: none; fill: #D45C1C; stroke-dashoffset: 0; }
        #rv-splash .rv-splash-word { animation: none; opacity: 1; }
        #rv-splash .rv-splash-bar::before { animation: rv-splash-pulse 1.2s ease-in-out infinite; width: 100%; }
        @keyframes rv-splash-pulse { 50% { opacity: .4; } }
      }
    </style>
  </head>
  <body>
    <div id="rv-splash" role="status" aria-label="Loading Rookvex">
      <svg viewBox="0 0 40 40" width="64" height="64" aria-hidden="true">
        <path d="M8 5h5v4h4.5V5h5v4H27V5h5v9H8z"/>
        <path fill-rule="evenodd" d="M8 16.5h24L20 37zM14.6 16.5L20 25.4l5.4-8.9z"/>
      </svg>
      <div class="rv-splash-word" aria-hidden="true">ROOKVEX</div>
      <div class="rv-splash-bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
