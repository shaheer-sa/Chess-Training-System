name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm run test -- --reporter=dot
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Chromium for smoke check
        run: npx playwright install --with-deps chromium
      - name: Smoke check (360px and 1280px)
        run: node scripts/ci/smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ github.sha }}
          path: smoke-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  frozen-files:
    name: Frozen-file guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check protected paths against main
        run: bash scripts/ci/frozen-guard.sh
